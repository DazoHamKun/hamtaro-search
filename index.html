hp:['<h2>使い方・注意事項</h2><h3>キャラから探す</h3><ul><li>キャラを選ぶ（複数可）と、全員が共演している話を表示します。</li><li>選んだキャラごとに、区分（セリフなし／セリフあり／主役回）を選べます。</li><li>放送日の範囲でも絞り込めます。</li><li>背景色：主役回は薄い黄色、セリフなしのみは薄いグレーです。</li><li>タイトルをタップすると、「話から探す」で詳細を開きます。</li></ul><h3>話から探す</h3><ul><li>話数またはタイトル（日本語・韓国語・英語）で絞り込めます。</li><li>話を選ぶと出演キャラを表示します。キャラをタップすると、そのキャラの話一覧に移ります。</li></ul><h3>お気に入り</h3><ul><li>★を押すと登録・解除できます。</li><li>お気に入りは、お使いのブラウザ内にだけ保存されます。別の端末・ブラウザには引き継がれず、ブラウザのデータを消すと消えます。</li></ul><h3>ご注意</h3><ul><li>このサイトは「とっとこハム太郎」の非公式ファンサイトで、公式・権利者とは一切関係ありません。</li><li>「主役回」の基準は、作成者の主観によるものです。「この回はこのキャラが主役では」というご意見があれば、作成者のX{X}までご連絡ください。</li><li>バグ、誤字脱字、外国語の誤訳などを見つけたときも、作成者のX{X}までご連絡ください。</li><li>韓国語・英語のタイトルやキャラ名が無いものは、日本語のまま表示しています。</li></ul>',
'<h2>사용 방법·유의사항</h2><h3>캐릭터로 찾기</h3><ul><li>캐릭터를 선택하면(여러 명 가능) 모두가 함께 출연한 에피소드가 표시됩니다.</li><li>선택한 캐릭터별로 구분(대사 없음/대사 있음/주연회)을 고를 수 있습니다.</li><li>방영일 범위로도 좁힐 수 있습니다.</li><li>배경색: 주연회는 연한 노랑, 대사 없음만 있는 경우는 연한 회색입니다.</li><li>제목을 누르면 ‘에피소드로 찾기’에서 상세 내용이 열립니다.</li></ul><h3>에피소드로 찾기</h3><ul><li>회차 또는 제목(일본어·한국어·영어)으로 좁힐 수 있습니다.</li><li>에피소드를 선택하면 출연 캐릭터가 표시되고, 캐릭터를 누르면 그 캐릭터의 에피소드 목록으로 이동합니다.</li></ul><h3>즐겨찾기</h3><ul><li>★를 누르면 등록·해제할 수 있습니다.</li><li>즐겨찾기는 사용 중인 브라우저에만 저장됩니다. 다른 기기·브라우저로는 이어지지 않으며, 브라우저 데이터를 지우면 사라집니다.</li></ul><h3>유의사항</h3><ul><li>이 사이트는 ‘방가방가 햄토리(とっとこハム太郎)’의 비공식 팬 사이트이며, 공식·권리자와는 일절 관계가 없습니다.</li><li>‘주연회’의 기준은 제작자의 주관입니다. ‘이 회차는 이 캐릭터가 주연’이라는 의견이 있으시면 제작자의 X{X}로 연락해 주세요.</li><li>버그, 오탈자, 외국어 번역 오류를 발견하셨을 때도 제작자의 X{X}로 연락해 주세요.</li><li>한국어·영어 제목이나 캐릭터 이름이 없는 경우(미방영 등)는 일본어로 표시됩니다.</li></ul>',
'<h2>How to use &amp; notes</h2><h3>By character</h3><ul><li>Pick one or more characters to see the episodes where all of them appear together.</li><li>For each selected character you can choose the type: cameo (no lines), speaking role or starring.</li><li>You can also narrow by air date.</li><li>Background colors: starring episodes are light yellow; episodes with only silent cameos are light gray.</li><li>Tap a title to open its details under “By episode”.</li></ul><h3>By episode</h3><ul><li>Filter by episode number or title (Japanese, Korean or English).</li><li>Select an episode to see its cast; tap a character to jump to that character’s episode list.</li></ul><h3>Favorites</h3><ul><li>Tap ★ to add or remove a favorite.</li><li>Favorites are saved only in this browser. They do not carry over to other devices or browsers, and clearing browser data removes them.</li></ul><h3>Notes</h3><ul><li>This is an unofficial fan site for “Hamtaro” (Tottoko Hamtaro) and has no connection with the official producers or rights holders.</li><li>Which episodes count as “starring” is the creator’s personal judgment. If you think a different character leads an episode, please contact the creator on X{X}.</li><li>If you find a bug, a typo or a translation error, please also contact the creator on X{X}.</li><li>Where no Korean or English title or name exists (for example, episodes not aired abroad), the Japanese is shown.</li></ul>'],
ft:['非公式のファンサイトです。公式・権利者とは一切関係ありません。<br>サイト管理者：だぞはむ{X}','비공식 팬 사이트입니다. 공식·권리자와는 일절 관계가 없습니다.<br>사이트 관리자: だぞはむ{X}','Unofficial fan site. It has no connection with the official producers or rights holders.<br>Site admin: だぞはむ{X}']};
const X='dazo_ham_kun';
const xl=()=>X?` (<a href="https://x.com/${X}" target="_blank" rel="noopener">@${X}</a>)`:'';/* ← 作成者のXのID（@なし）をここに入れる。空なら「作成者のX」とだけ表示 */
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}return null};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const norm=s=>s.normalize('NFKC').toLowerCase(),LG=['ja','ko','en'];
let lang=ls('lang')||'ja',LI=Math.max(0,LG.indexOf(lang)),tab='c',cur=0,sel=new Set(),tm={},fav=new Set();
try{fav=new Set(JSON.parse(ls('fav')||'[]'))}catch(e){}
const t=k=>S[k][LI],fn=n=>LI==0?n+'話':LI==1?n+'화':'Ep. '+n,cn=n=>LI==0?n+'件':LI==1?n+'건':n+(n==1?' result':' results');
const CH=Object.fromEntries(D.C.map(c=>[c.i,c])),EP=D.E,AP={},MN={},RK={C:0,S:1,M:2};
for(const e of EP){const m=new Map();for(const x of(D.A[e.n]||'').split(',')){if(x)m.set(+x.slice(0,-1),x.slice(-1))}AP[e.n]=m;MN[e.n]=[...m].filter(p=>p[1]=='M').map(p=>p[0]);e.k=norm([e.ja,e.ko,e.en].join(' '))}
const nm=c=>c[LG[LI]]||c.ja,ti=e=>e[LG[LI]]||e.ja,col=c=>`style="--c:${c.c||'var(--fg)'}"`;
const star=n=>`<button class="st${fav.has(n)?' on':''}" data-f="${n}" aria-label="★">★</button>`;
const leads=n=>MN[n].map(i=>`<span class="mc" ${col(CH[i])}>${esc(nm(CH[i]))}</span>`).join(LI?', ':'、');
const tset=i=>tm[i]||(tm[i]=new Set(['C','S','M']));
function panel(){
 const chip=c=>`<label class="chip"><input type="checkbox" data-c="${c.i}"${sel.has(c.i)?' checked':''}><span class="mc" ${col(c)}>${esc(nm(c))}</span></label>`;
 const w=matchMedia('(min-width:900px)').matches;
 $('#pl').innerHTML=`<details open><summary>${t('ham')}</summary><div class="chips">${D.C.filter(c=>c.r).map(chip).join('')}</div></details>
<details${w?' open':''}><summary>${t('oth')}</summary><div class="chips sc">${D.C.filter(c=>!c.r).map(chip).join('')}</div></details>`;
 $('#pr').innerHTML=`<b>${t('gt')}</b><div id="tp"></div>
<div class="sec"><b>${t('dt')}</b><input type="date" id="d1" min="${D.d0}" max="${D.d1}"> ～ <input type="date" id="d2" min="${D.d0}" max="${D.d1}"><button data-a="clr">${t('clr')}</button></div>`;
 tpanel()}
function tpanel(){
 $('#tp').innerHTML=[...sel].sort((a,b)=>a-b).map(i=>`<div class="tr"><span class="mc" ${col(CH[i])}>${esc(nm(CH[i]))}</span>${'CSM'.split('').map(k=>`<label class="chip"><input type="checkbox" data-t="${k}" data-i="${i}"${tset(i).has(k)?' checked':''}>${t(k)}</label>`).join('')}</div>`).join('')||`<p class="hint">${t('tp0')}</p>`}
function rc(){
 const ids=[...sel],a=$('#d1').value,b=$('#d2').value,out=[],co=LI?': ':'：';
 if(!ids.length){$('#rs').innerHTML=`<p class="hint">${t('hint')}</p>`;return}
 for(const e of EP){const m=AP[e.n];
  if(!ids.every(i=>m.has(i)&&tset(i).has(m.get(i)))||(a&&e.d<a)||(b&&e.d>b))continue;
  const hl=ids.some(i=>m.get(i)=='M')?'m':ids.every(i=>m.get(i)=='C')?'c':'';
  const ls_=ids.map(i=>`<div class="mc" ${col(CH[i])}>${ids.length>1?esc(nm(CH[i]))+co:''}${t(m.get(i))}</div>`).join('');
  out.push(`<div class="row ${hl}">${star(e.n)}<span class="n">${fn(e.n)}</span><a class="t" data-e="${e.n}" tabindex="0">${esc(ti(e))}</a><span class="d">${e.d}</span><div class="y">${ls_}</div></div>`)}
 $('#rs').innerHTML=`<p class="cnt">${cn(out.length)}</p>`+(out.length?`<div class="row hd"><span></span><span>#</span><span>${t('ct')}</span><span>${t('dt')}</span><span>${t('ty')}</span></div>`+out.join(''):`<p class="hint">${t('none')}</p>`)}
const erow=e=>`<div class="row e${cur==e.n?' sel':''}" data-e="${e.n}">${star(e.n)}<span class="n">${fn(e.n)}</span><span class="t">${esc(ti(e))}</span><span class="y">${leads(e.n)}</span></div>`;
function le(){const k=norm($('#kw').value.trim()),mo=$('#mo').checked;
 const L=EP.filter(e=>(!k||String(e.n)==k||e.k.includes(k))&&(!mo||MN[e.n].length));
 $('#el').innerHTML=L.map(erow).join('')||`<p class="hint">${t('none')}</p>`}
function ld(){if(!cur){$('#ed').innerHTML='';return}
 const e=EP.find(x=>x.n==cur),m=AP[cur];
 const rows=[...m].sort((a,b)=>RK[b[1]]-RK[a[1]]||a[0]-b[0]).map(([i,k])=>`<div class="row cr ${k=='M'?'m':k=='C'?'c':''}" data-k="${i}"><span class="mc" ${col(CH[i])}>${esc(nm(CH[i]))}</span><span class="mc" ${col(CH[i])}>${t(k)}</span></div>`).join('');
 $('#ed').innerHTML=`<button class="bk" data-a="bk">‹ ${t('bk')}</button><h2>${fn(e.n)} ${esc(ti(e))}</h2><p class="d">${e.d}</p><h3>${t('cast')} (${m.size})</h3>${rows}`}
function lf(){$('#fl').innerHTML=EP.filter(e=>fav.has(e.n)).map(erow).join('')||`<p class="hint">${t('nf')}</p>`}
function go(x){tab=x;for(const k of 'cef')$('#v'+k).hidden=k!=x;$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.go==x));
 if(x=='c')rc();if(x=='e'){le();ld()}if(x=='f')lf()}
function ui(){document.documentElement.lang=lang;$('#lg').value=lang;document.title=t('h1');$('#h1').textContent=t('h1');
 $('#nc').textContent=t('tc');$('#ne').textContent=t('te');$('#nf').textContent=t('tf');
 $('#hb').title=t('hl');$('#hb').setAttribute('aria-label',t('hl'));$('#kw').placeholder=t('kw');$('#mol').textContent=t('mo');$('#ft').innerHTML=t('ft').replace(/\{X\}/g,xl());
 const a=$('#d1')?.value,b=$('#d2')?.value;panel();$('#d1').value=a||'';$('#d2').value=b||'';go(tab)}
function openEp(n){cur=n;$('#kw').value='';$('#mo').checked=false;go('e');$('#ed').classList.add('open');$('#el .sel')?.scrollIntoView({block:'center'})}
function tog(n){fav.has(n)?fav.delete(n):fav.add(n);ls('fav',JSON.stringify([...fav]));
 $$(`[data-f="${n}"]`).forEach(b=>b.classList.toggle('on',fav.has(n)));if(tab=='f')lf()}
document.addEventListener('click',ev=>{const g=s=>ev.target.closest(s);let x;
 if(x=g('[data-f]'))return tog(+x.dataset.f);
 if(x=g('[data-e]'))return openEp(+x.dataset.e);
 if(x=g('[data-k]')){sel=new Set([+x.dataset.k]);tm={};$('#d1').value=$('#d2').value='';$$('[data-c]').forEach(i=>i.checked=sel.has(+i.dataset.c));tpanel();$('#ed').classList.remove('open');return go('c')}
 if(x=g('[data-go]'))return go(x.dataset.go);
 if(x=g('[data-a]')){if(x.dataset.a=='bk')$('#ed').classList.remove('open');else{sel.clear();tm={};$$('[data-c]').forEach(i=>i.checked=false);$('#d1').value=$('#d2').value='';tpanel();rc()}}});
document.addEventListener('keydown',ev=>{if(ev.key=='Enter'&&ev.target.dataset.e)openEp(+ev.target.dataset.e)});
document.addEventListener('change',ev=>{const i=ev.target,d=i.dataset;
 if(d.c){i.checked?sel.add(+d.c):sel.delete(+d.c);tpanel();rc()}else if(d.t){const q=tset(+d.i);i.checked?q.add(d.t):q.delete(d.t);rc()}
 else if(i.id=='d1'||i.id=='d2')rc();else if(i.id=='mo')le();
 else if(i.id=='lg'){lang=i.value;LI=LG.indexOf(lang);ls('lang',lang);ui()}});
$('#kw').addEventListener('input',le);
function help(){const x=X?` (<a href="https://x.com/${X}" target="_blank" rel="noopener">@${X}</a>)`:'';$('#hc').innerHTML=t('hp').replace(/\{X\}/g,x)+`<button class="x" data-x>${t('cl')}</button>`;$('#hp').showModal()}
$('#hb').addEventListener('click',help);
$('#hp').addEventListener('click',ev=>{if(ev.target.id=='hp'||ev.target.dataset.x!==undefined)$('#hp').close()});
ui();
</script></body></html>
